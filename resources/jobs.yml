resources:
  jobs:

    platform_observability_job:

      name: platform_observability_job

      job_clusters:

        - job_cluster_key: observability_cluster

          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 2

      tasks:

        - task_key: liquid_clustering_analysis

          notebook_task:
            notebook_path: ../notebooks/liquid_clustering/liquid_clustering_analysis

          job_cluster_key: observability_cluster

        - task_key: predictive_optimization_analysis

          depends_on:
            - task_key: liquid_clustering_analysis

          notebook_task:
            notebook_path: ../notebooks/predictive_optimization/predictive_optimization_analysis

          job_cluster_key: observability_cluster

        - task_key: dlt_pipeline_analysis

          depends_on:
            - task_key: predictive_optimization_analysis

          notebook_task:
            notebook_path: ../notebooks/dlt/dlt_pipeline_analysis

          job_cluster_key: observability_cluster

        - task_key: unity_catalog_governance

          depends_on:
            - task_key: dlt_pipeline_analysis

          notebook_task:
            notebook_path: ../notebooks/governance/unity_catalog_governance

          job_cluster_key: observability_cluster

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"

      max_concurrent_runs: 1